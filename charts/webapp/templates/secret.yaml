{{- if not .Values.secret.existingSecret }}
{{- $name := include "webapp.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if .Values.secret.apiToken }}
  API_TOKEN: {{ .Values.secret.apiToken | b64enc }}
  {{- else if $existing }}
  API_TOKEN: {{ index $existing.data "API_TOKEN" }}
  {{- else }}
  API_TOKEN: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
