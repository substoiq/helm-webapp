apiVersion: v1
kind: Pod
metadata:
  name: {{ include "webapp.fullname" . }}-test
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget"]
      args: ["-q", "-O-", "http://{{ include "webapp.fullname" . }}:{{ .Values.service.port }}/readyz"]
